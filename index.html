<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b98b5e">
<title>Paper Pilots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 30 60 6 36 58 28 36z' fill='%23f6efdc' stroke='%232c2416' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M28 36 60 6' stroke='%232c2416' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/player-view.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
</head>

<body data-screen="boot">

<!-- Hand-drawn SVG filter used to roughen borders on paper UI -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <symbol id="i-plane" viewBox="0 0 64 64"><path d="M4 30 60 6 36 58 28 36z" fill="currentColor" stroke="#2c2416" stroke-width="3.5" stroke-linejoin="round"/><path d="M28 36 60 6" stroke="#2c2416" stroke-width="3" fill="none"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 48"><path d="M8 14v20a4 4 0 0 0 8 0V8a6 6 0 0 0-12 0v28a8 8 0 0 0 16 0V14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="10" r="7" fill="currentColor" stroke="#2c2416" stroke-width="2"/><circle cx="9.5" cy="7.5" r="2" fill="#fff" opacity=".6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor" stroke="#2c2416" stroke-width="2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" stroke="#2c2416" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#2c2416" stroke-width="2.4"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<section id="boot" class="screen"></section>

<section id="home" class="screen">
  <div class="title-card note">
    <svg class="logo" aria-hidden="true"><use href="#i-plane"/></svg>
    <h1>Paper Pilots</h1>
  </div>
  <div class="home-actions">
    <button id="host-btn" class="btn primary">Start a room</button>
    <button id="solo-btn" class="btn">Solo flight</button>
    <form id="join-form" class="join">
      <label class="sr-only" for="join-code">Room code</label>
      <input id="join-code" class="field code-field" maxlength="4" autocomplete="off"
             autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD">
      <button type="submit" class="btn">Join</button>
    </form>
  </div>
  <p id="home-status" class="status" role="status"></p>
</section>

<section id="name" class="screen">
  <form id="name-form" class="note card-form">
    <label for="name-input" class="big-label">Your name</label>
    <input id="name-input" class="field" maxlength="12" autocomplete="nickname" required>
    <button type="submit" class="btn primary">Continue</button>
  </form>
</section>

<section id="solo" class="screen">
  <form id="solo-form" class="note card-form">
    <h2>Solo flight</h2>
    <label for="solo-name" class="big-label">Your name</label>
    <input id="solo-name" class="field" maxlength="12" autocomplete="nickname" required>
    <fieldset class="seg">
      <legend>Rivals</legend>
      <label><input type="radio" name="bots" value="0"><span>0</span></label>
      <label><input type="radio" name="bots" value="1"><span>1</span></label>
      <label><input type="radio" name="bots" value="2"><span>2</span></label>
      <label><input type="radio" name="bots" value="3" checked><span>3</span></label>
    </fieldset>
    <fieldset class="seg">
      <legend>Floors</legend>
      <label><input type="radio" name="floors" value="3"><span>3</span></label>
      <label><input type="radio" name="floors" value="6" checked><span>6</span></label>
    </fieldset>
    <div class="row">
      <button type="button" id="solo-back" class="btn ghost">Back</button>
      <button type="submit" class="btn primary">Take off</button>
    </div>
    <p class="keys">Aim <kbd>&larr;</kbd><kbd>&rarr;</kbd> angle <kbd>&uarr;</kbd><kbd>&darr;</kbd> hold <kbd>Space</kbd> to throw &middot; fly with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></p>
  </form>
</section>

<section id="lobby" class="screen">
  <div class="lobby-board">
    <div id="host-panel" class="note qr-note">
      <svg class="pin" aria-hidden="true"><use href="#i-pin"/></svg>
      <canvas id="qr" width="240" height="240" aria-label="Scan to join"></canvas>
      <p class="code" id="room-code" aria-live="polite"></p>
      <button id="copy-link" class="btn ghost small"><svg class="ico"><use href="#i-copy"/></svg><span>Copy link</span></button>
      <p id="join-url" class="join-url"></p>
    </div>
    <div class="lobby-side">
      <ul id="roster" aria-live="polite"></ul>
      <div id="host-controls">
        <fieldset class="seg">
          <legend>Floors</legend>
          <label><input type="radio" name="hfloors" value="3"><span>3</span></label>
          <label><input type="radio" name="hfloors" value="6" checked><span>6</span></label>
        </fieldset>
        <button id="start-btn" class="btn primary" disabled>Start game</button>
      </div>
      <div id="joiner-controls">
        <div id="me-chip" class="me-chip"></div>
        <button id="ready-btn" class="btn primary big">Ready</button>
      </div>
      <p id="lobby-status" class="status" role="status"></p>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <div id="controller"></div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
